# Rebuilds the note index and deploys the site to GitHub Pages on every push to main.
# This is what makes notes published from the Architect appear on the website automatically.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Quality gate: nothing reaches the live site unless every file parses and every test passes.
      - name: Check syntax and run tests
        run: |
          node scripts/check-syntax.mjs
          node --test tests/
      - name: Build note index
        run: node scripts/build-index.mjs
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html css js vendor content _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
