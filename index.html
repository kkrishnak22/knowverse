<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knowverse</title>
  <meta name="description" content="A knowledge multiverse: explore universes of interconnected notes and write them with an AI workspace.">
  <meta name="theme-color" content="#07090f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='5' fill='%235eead4'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%237c9cff' stroke-width='1.5' opacity='.7'/%3E%3Ccircle cx='27' cy='16' r='2.4' fill='%237c9cff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Web fonts load without blocking the first paint. Until they arrive, text uses the
       metric-matched fallbacks defined at the top of css/styles.css, so nothing moves. -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/multiverse.css">
  <link rel="stylesheet" href="css/learn.css">
</head>
<body>
  <div id="app">
    <nav class="rail" aria-label="Primary">
      <a class="brand" href="#/" title="Knowverse" aria-label="Multiverse home">
        <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
          <circle cx="16" cy="16" r="11" fill="none" stroke="url(#bg)" stroke-width="1.5" opacity=".8"/>
          <circle cx="16" cy="16" r="4.5" fill="#5eead4"/>
          <circle cx="27" cy="16" r="2.3" fill="#7c9cff"/>
          <circle cx="8.2" cy="8.2" r="1.6" fill="#a78bfa"/>
          <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#7c9cff"/></linearGradient></defs>
        </svg>
      </a>
      <div class="rail-nav" id="rail-nav"></div>
      <div class="rail-foot" id="rail-foot"></div>
    </nav>

    <div class="main">
      <header class="topbar">
        <div class="topbar-title">
          <a class="topbar-name" href="#/">Knowverse</a>
          <span class="topbar-sep">/</span>
          <span class="topbar-view" id="topbar-view">Multiverse</span>
        </div>
        <button class="search-trigger" id="search-trigger" type="button">
          <span class="ico" data-icon="search"></span>
          <span>Search notes…</span>
          <kbd>Ctrl K</kbd>
        </button>
        <div class="topbar-status" id="topbar-status"></div>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="overlays"></div>
  <div id="toasts" aria-live="polite"></div>

  <noscript>This site needs JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
